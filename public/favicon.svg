<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mhGrad" gradientUnits="userSpaceOnUse" x1="22" y1="20" x2="78" y2="80">
      <stop offset="0%" stop-color="#B26BFF"/>
      <stop offset="55%" stop-color="#9B4DFF"/>
      <stop offset="100%" stop-color="#3FE0F0"/>
    </linearGradient>

    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#14121C"/>
      <stop offset="100%" stop-color="#08070B"/>
    </radialGradient>

    <filter id="mhGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Unified MH monogram -->
  <g filter="url(#mhGlow)"
     fill="none"
     stroke="url(#mhGrad)"
     stroke-width="7.5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <line x1="30" y1="24" x2="30" y2="76"/>
    <line x1="70" y1="24" x2="70" y2="76"/>
    <path d="M 30 24 L 50 46 L 70 24"/>
    <line x1="30" y1="50" x2="70" y2="50"/>
  </g>

  <circle cx="50" cy="46" r="2.6" fill="#3FE0F0" filter="url(#mhGlow)"/>
</svg>
